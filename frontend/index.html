<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defense Platform — Suricata IDS/IPS SOC Dashboard</title>
    
    <!-- Meta tags for enterprise dashboard -->
    <meta name="description" content="Enterprise Cybersecurity Administration Dashboard for Network Intrusion Detection & Prevention System" />
    <meta name="theme-color" content="#090c13" />

    <!-- Google Fonts for crisp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Compiled Tailwind CSS v4 -->
    <link rel="stylesheet" href="./src/css/output.css" />

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      font-mono, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-[#090c13] text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    
    <!-- App Layout Container -->
    <div id="app" class="flex min-h-screen relative overflow-x-hidden">
      
      <!-- Collapsible Sidebar (Rendered via sidebar.js) -->
      <aside id="sidebar" class="hidden lg:block z-40 h-screen sticky top-0 transition-all duration-300"></aside>

      <!-- Main Application Surface -->
      <div class="flex-1 flex flex-col min-w-0 min-h-screen">
        
        <!-- Topbar Header (Rendered via topbar.js) -->
        <div id="topbar"></div>

        <!-- Dynamic Page View Container (Rendered via router.js) -->
        <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto"></main>

        <!-- SOC Footer -->
        <footer class="px-6 py-3.5 border-t border-slate-200 dark:border-[#1e2638] bg-white dark:bg-[#0c1017] text-slate-500 text-[11px] flex flex-col sm:flex-row items-center justify-between gap-3 font-mono">
          <div class="flex items-center gap-3">
            <span class="flex items-center gap-1.5 text-emerald-400">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              SURICATA ENGINE 7.0.4 INLINE
            </span>
            <span>•</span>
            <span>POSTGRESQL TELEMETRY REPO: CONNECTED</span>
          </div>
          <div class="flex items-center gap-4">
            <a href="./assets/img/ui-reference.webp" target="_blank" class="text-slate-400 hover:text-slate-200 underline flex items-center gap-1 font-sans">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              View UI Reference Design
            </a>
            <span>SOC Aegis Defense Platform v2.4</span>
          </div>
        </footer>

      </div>

    </div>

    <!-- Modal Root Container -->
    <div id="modal-root"></div>

    <!-- ES Module App Entry Point -->
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
